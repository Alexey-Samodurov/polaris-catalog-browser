name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests and the Testcontainers suites (Polaris 1.4.1, SeaweedFS); the runner has Docker.
      - run: ./gradlew build
      - run: ./gradlew :plugin:verifyPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            */build/reports/tests/
            plugin/build/reports/pluginVerifier/
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin/build/distributions/*.zip
